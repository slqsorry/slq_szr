<!DOCTYPE html>
<!DOCTYPE html>
<html lang="zh-C">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的数字人助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">我的数字人助手</h1>
        
        <!-- 你的原版数字人界面 -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8 text-center">
            <img id="avatar" src="https://ts1.tc.mm.bing.net/th/id/OIP-C.MboIhEoeGnd8LNGy7pPWgHaHf?rs=1&pid=ImgDetMain&o=7&rm=3" alt="数字人" class="mx-auto rounded-lg max-h-96 mb-4">
            <p class="text-gray-600">你可以向我提问，我会用我的声音为你解答！</p>
        </div>
        
        <!-- 聊天区域 -->
        <div id="chat-container" class="bg-white rounded-lg shadow-lg p-6 mb-8 h-96 overflow-y-auto">
            <div class="mb-4">
                <div class="bg-blue-100 rounded-lg p-3 inline-block">
                    你好！我是你的专属数字人助手~
                </div>
            </div>
        </div>
        
        <!-- 输入框 -->
        <div class="flex gap-4">
            <input type="text" id="question-input" placeholder="请输入你的问题..." 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                发送
            </button>
        </div>
    </div>

    <script>
        // 你的睿声密钥 + 角色ID（已填好）
        const API_KEY = "sk-12ebe65a69fbdde4e0387a2133661b2e";
        const VOICE_ID = "ef16fe1a-abfe-4e5f-9a9a-d6ac07cea2e2";

        const chatContainer = document.getElementById('chat-container');
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        let currentAudio = null;

        // 发送问题
        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            addMessage(question, 'user');
            questionInput.value = '';
            sendBtn.disabled = true;

            try {
                const answer = getLocalAnswer(question);
                addMessage(answer, 'assistant');
                // 在线部署后，调用API无CORS报错
                await playReechoVoice(answer);
            } catch (error) {
                addMessage('抱歉，我暂时无法回答~', 'assistant');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
            }
        }

        // AI问答库
        function getLocalAnswer(question) {
            const q = question.toLowerCase();
            if (q.includes('你好')) return '你好呀！很高兴为你服务！';
            if (q.includes('名字')) return '我是你的专属数字人助手！';
            if (q.includes('做什么') || q.includes('功能')) return '我可以回答你的问题，陪你聊天，用我的声音为你朗读答案！';
            if (q.includes('谢谢')) return '不客气，这是我应该做的！';
            return '我正在学习更多知识，你可以问我日常问题哦！';
        }

        // 调用睿声API（在线部署后完美运行）
        async function playReechoVoice(text) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            try {
                const res = await fetch("https://v1.wusound.cn/api/tts/simple-generate", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ voiceId: VOICE_ID, text: text, speed: 1.0 })
                });

                const data = await res.json();
                if (data.success) {
                    currentAudio = new Audio(data.data.audioUrl);
                    await currentAudio.play();
                }
            } catch (err) {
                console.error("语音播放失败：", err);
            }
        }

        // 聊天消息
        function addMessage(text, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `mb-4 ${role === 'user' ? 'text-right' : 'text-left'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `inline-block p-3 rounded-lg ${role === 'user' ? 'bg-green-100' : 'bg-blue-100'}`;
            bubbleDiv.textContent = text;
            
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', sendQuestion);
        questionInput.addEventListener('keypress', (e) => e.key === 'Enter' && sendQuestion());
    </script>
</body>
</html>
