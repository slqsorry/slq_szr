<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI问答 + 睿声实时语音（v1域名+60秒超时）</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">AI问答 + 我的专属克隆声音（v1域名）</h1>
        
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8 text-center">
            <img src="https://picsum.photos/200/200" alt="数字人" class="mx-auto rounded-lg max-h-96 mb-4">
            <p class="text-gray-600">硅基流动AI + 睿声v1.wusound.cn接口（60秒超时）</p>
        </div>
        
        <div id="chat-container" class="bg-white rounded-lg shadow-lg p-6 mb-8 h-96 overflow-y-auto">
            <div class="mb-4">
                <div class="bg-blue-100 rounded-lg p-3 inline-block">
                    按F12打开Console查看v1域名调用日志～
                </div>
            </div>
        </div>
        
        <div class="flex gap-4">
            <input type="text" id="question-input" placeholder="请输入你的问题..." 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                发送（v1域名）
            </button>
        </div>
    </div>

    <script>
        // ===================== 核心配置（修正为v1.wusound.cn） ======================
        const CONFIG = {
            reecho: {
                baseUrl: "https://v1.wusound.cn",        // 修正：使用v1.wusound.cn域名
                realtimeTtsApi: "/v1/tts/synthesize",    // 接口路径保持不变
                apiKey: "sk-12ebe65a69fbdde4e0387a2133661b2e",
                voiceId: "ef16fe1a-abfe-4e5f-9a9a-d6ac07cea2e2",
                timeout: 60000 // 60秒超时
            },
            siliconflow: {
                url: "https://api.siliconflow.cn/v1/chat/completions",
                key: "sk-vsjboqquowgbxbrkqoizrrptqwpizopzfhxtqijfdtkjogft",
                model: "Qwen/Qwen3-8B",
                timeout: 10000
            }
        };

        // 全局变量
        const chatContainer = document.getElementById('chat-container');
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        let activeAudio = null;
        let chatHistory = [{ role: "system", content: "回答简洁，纯中文，无特殊符号，不超过80字。" }];

        // 彩色日志工具
        function log(type, module, message, data = null) {
            const colors = {
                info: "#2196F3",
                success: "#4CAF50",
                warn: "#FF9800",
                error: "#F44336"
            };
            const timestamp = new Date().toLocaleTimeString();
            console.log(
                `%c[${timestamp}] [${module}] ${message}`,
                `color: ${colors[type]}; font-weight: bold;`,
                data ? "\n附加数据：" : "",
                data || ""
            );
        }

        // 1. 硅基流动AI（无修改）
        async function getAiAnswer(question) {
            log("info", "AI", "开始调用硅基流动AI", { question });
            chatHistory.push({ role: "user", content: question });
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), CONFIG.siliconflow.timeout);

                const aiRequestData = {
                    model: CONFIG.siliconflow.model,
                    messages: chatHistory,
                    temperature: 0.7,
                    max_tokens: 80,
                    stream: false
                };
                log("info", "AI", "AI请求参数", aiRequestData);

                const res = await fetch(CONFIG.siliconflow.url, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${CONFIG.siliconflow.key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(aiRequestData),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                log("info", "AI", `AI接口响应状态码`, res.status);

                if (!res.ok) {
                    const errorText = await res.text();
                    log("error", "AI", `AI接口请求失败`, { status: res.status, response: errorText });
                    throw new Error(`AI接口错误（状态码：${res.status}）`);
                }

                const aiResponse = await res.json();
                log("success", "AI", "AI接口返回完整数据", aiResponse);
                
                const answer = aiResponse.choices[0].message.content.trim();
                chatHistory.push({ role: "assistant", content: answer });
                log("success", "AI", "AI回答提取完成", { answer });
                
                return answer;
            } catch (err) {
                const errorMsg = err.name === "AbortError" ? "AI请求超时" : err.message;
                log("error", "AI", `AI调用失败`, { error: errorMsg, stack: err.stack });
                throw new Error(`AI回答失败：${errorMsg}`);
            }
        }

        // 2. 睿声实时语音（仅修改域名，其余不变）
        async function playRealtimeVoice(text) {
            const cleanText = text
                .replace(/[^\u4e00-\u9fa5，。！？、]/g, "")
                .substring(0, 500);
            
            log("info", "VOICE", "语音合成文本预处理完成", { rawText: text, cleanText });
            
            if (!cleanText) {
                log("warn", "VOICE", "预处理后文本为空");
                addMessage("❌ 文本为空/含非法字符，无法合成声音", "assistant");
                return false;
            }

            if (activeAudio) {
                activeAudio.pause();
                activeAudio = null;
            }

            try {
                addMessage("🔊 正在调用睿声v1接口（60秒超时）...", "assistant");
                const fullApiUrl = CONFIG.reecho.baseUrl + CONFIG.reecho.realtimeTtsApi;
                log("info", "VOICE", "睿声最终接口地址", { fullApiUrl });

                const voiceRequestData = {
                    voiceId: CONFIG.reecho.voiceId,
                    text: cleanText,
                    promptId: "default",
                    preset: "balance",
                    break_clone: true,
                    language: "auto",
                    vivid: false,
                    emo_switch: [0,0,0,0,0],
                    speechRate: 1,
                    flash: false,
                    stream: false,
                    seed: -1,
                    srt: false
                };
                log("info", "VOICE", "睿声请求参数", voiceRequestData);

                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    controller.abort();
                    log("error", "VOICE", "睿声请求超时（60秒）");
                }, CONFIG.reecho.timeout);

                const res = await fetch(fullApiUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${CONFIG.reecho.apiKey}`,
                        "Content-Type": "application/json",
                        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
                    },
                    body: JSON.stringify(voiceRequestData),
                    mode: "cors",
                    credentials: "omit",
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                log("info", "VOICE", `睿声接口响应状态码`, res.status);

                const rawResponse = await res.text();
                log("info", "VOICE", "睿声原始响应", rawResponse);

                if (!res.ok) {
                    log("error", "VOICE", `睿声接口失败`, { status: res.status, rawResponse });
                    throw new Error(`睿声接口错误（状态码：${res.status}）`);
                }

                let voiceResponse;
                try {
                    voiceResponse = JSON.parse(rawResponse);
                    log("info", "VOICE", "睿声响应解析完成", voiceResponse);
                } catch (parseErr) {
                    log("error", "VOICE", "睿声响应解析失败", { parseErr, rawResponse });
                    throw new Error("睿声返回数据格式错误");
                }

                if (voiceResponse.code !== 0) {
                    log("error", "VOICE", "睿声合成失败", { code: voiceResponse.code, message: voiceResponse.message });
                    throw new Error(`睿声错误（code=${voiceResponse.code}）：${voiceResponse.message}`);
                }

                if (!voiceResponse.data?.audio_url) {
                    log("error", "VOICE", "睿声缺失音频链接", voiceResponse.data);
                    throw new Error("睿声未返回音频链接");
                }

                activeAudio = new Audio(voiceResponse.data.audio_url);
                activeAudio.crossOrigin = "anonymous";
                activeAudio.onplay = () => log("success", "VOICE", "音频开始播放");
                activeAudio.onerror = (err) => {
                    log("error", "VOICE", "音频播放失败", { err, audioUrl: voiceResponse.data.audio_url });
                    throw new Error("音频播放失败");
                };
                activeAudio.onended = () => log("info", "VOICE", "音频播放完成");

                await activeAudio.play();
                addMessage("✅ 睿声v1接口语音播放成功！", "assistant");
                return true;

            } catch (err) {
                const errorMsg = err.name === "AbortError" ? "睿声请求超时（60秒）" : err.message;
                log("error", "VOICE", "睿声调用失败", { error: errorMsg, stack: err.stack });
                
                let tip = `❌ 语音调用失败：${errorMsg}`;
                if (errorMsg.includes("404")) tip += "（检查voiceId/接口路径）";
                if (errorMsg.includes("401")) tip += "（检查API Key）";
                if (errorMsg.includes("CORS")) tip += "（需配置跨域白名单/后端代理）";
                addMessage(tip, "assistant");
                return false;
            }
        }

        // 3. 主流程（无修改）
        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) {
                alert("请输入你的问题！");
                return;
            }

            questionInput.value = "";
            sendBtn.disabled = true;
            sendBtn.textContent = "处理中...";
            addMessage(question, "user");
            
            log("info", "MAIN", "开始处理用户请求", { question });

            try {
                const aiAnswer = await getAiAnswer(question);
                addMessage(`AI回答：${aiAnswer}`, "assistant");
                await playRealtimeVoice(aiAnswer);
            } catch (err) {
                log("error", "MAIN", "主流程失败", { error: err.message });
                addMessage(err.message, "assistant");
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "发送（v1域名）";
                log("info", "MAIN", "请求处理完成");
            }
        }

        // 辅助函数
        function addMessage(text, role) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `mb-4 ${role === "user" ? "text-right" : "text-left"}`;
            
            const bubble = document.createElement("div");
            bubble.className = `inline-block p-3 rounded-lg ${role === "user" ? "bg-green-100" : "bg-blue-100"}`;
            bubble.textContent = text;
            
            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 初始化
        log("success", "INIT", "页面初始化完成（v1.wusound.cn）", CONFIG);
        sendBtn.addEventListener("click", sendQuestion);
        questionInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendQuestion();
        });
    </script>
</body>
</html>
