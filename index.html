<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的数字人助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">我的数字人助手</h1>
        
        <!-- 数字人展示区（保留你的原版样式） -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8 text-center">
            <img id="avatar" src="https://ts1.tc.mm.bing.net/th/id/OIP-C.MboIhEoeGnd8LNGy7pPWgHaHf?rs=1&pid=ImgDetMain&o=7&rm=3" alt="数字人" class="mx-auto rounded-lg max-h-96 mb-4">
            <p class="text-gray-600">你可以向我提问，我会用我的声音为你解答！</p>
        </div>
        
        <!-- 聊天区域 -->
        <div id="chat-container" class="bg-white rounded-lg shadow-lg p-6 mb-8 h-96 overflow-y-auto">
            <div class="mb-4">
                <div class="bg-blue-100 rounded-lg p-3 inline-block">
                    你好！我是你的专属数字人助手，有任何问题都可以问我～
                </div>
            </div>
        </div>
        
        <!-- 输入区 -->
        <div class="flex gap-4">
            <input type="text" id="question-input" placeholder="请输入你的问题..." 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                发送
            </button>
        </div>
    </div>

    <script>
        // ===================== 已填好你的配置 ======================
        // 1. 睿声语音配置（你的信息）
        const REECHO_API_KEY = "sk-12ebe65a69fbdde4e0387a2133661b2e";
        const REECHO_VOICE_ID = "ef16fe1a-abfe-4e5f-9a9a-d6ac07cea2e2";
        
        // 2. 硅基流动AI配置（从你的截图复制）
        const SILICONFLOW_CONFIG = {
            url: "https://api.siliconflow.cn/v1/chat/completions", // 完整接口地址
            key: "sk-vsjboquowgbxbrkqoizrrptqwpizopzfhxtqjfdtkjogft", // 你的API密钥
            model: "Qwen/Qwen3-8B" // 推荐用千问3-8B模型（截图里的可用模型）
        };
        // ===============================================================

        const chatContainer = document.getElementById('chat-container');
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        let currentAudio = null;
        // 多轮对话历史
        let chatHistory = [
            { role: "system", content: "你是一个友好的智能助手，回答简洁易懂，语气亲切，只用中文回答，不要多余内容。" }
        ];

        // 核心：调用硅基流动AI API获取回答
        async function callSiliconflowAPI(question) {
            chatHistory.push({ role: "user", content: question });
            
            try {
                // 跨域代理 + 硅基流动接口
                const proxyUrl = "https://corsproxy.io/?";
                const fullApiUrl = proxyUrl + encodeURIComponent(SILICONFLOW_CONFIG.url);

                const response = await fetch(fullApiUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${SILICONFLOW_CONFIG.key}`,
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        model: SILICONFLOW_CONFIG.model,
                        messages: chatHistory,
                        temperature: 0.7, // 回答随机性
                        max_tokens: 1000,  // 最大回答长度
                        stream: false       // 非流式输出
                    })
                });

                if (!response.ok) {
                    throw new Error(`AI接口调用失败：${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                const answer = data.choices[0].message.content.trim();
                chatHistory.push({ role: "assistant", content: answer });
                return answer;
            } catch (error) {
                console.error("硅基流动API错误：", error);
                throw new Error("AI回答获取失败，请检查API密钥或网络～");
            }
        }

        // 调用睿声API播放你的克隆声音
        async function playReechoVoice(text) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            try {
                const proxyUrl = "https://corsproxy.io/?";
                const reechoApiUrl = proxyUrl + encodeURIComponent("https://v1.wusound.cn/api/tts/simple-generate");

                const response = await fetch(reechoApiUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${REECHO_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        voiceId: REECHO_VOICE_ID,
                        text: text,
                        speed: 1.0,
                        pitch: 1.0
                    })
                });

                const data = await response.json();
                if (data.success && data.data?.audioUrl) {
                    currentAudio = new Audio(data.data.audioUrl);
                    currentAudio.crossOrigin = "anonymous";
                    await currentAudio.play();
                } else {
                    throw new Error(data.message || "睿声语音生成失败");
                }
            } catch (error) {
                console.error("睿声API错误：", error);
                // 降级：浏览器自带语音朗读
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "zh-CN";
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 发送问题主流程
        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) {
                alert("请输入你的问题！");
                return;
            }

            // 显示用户问题
            addMessage(question, "user");
            questionInput.value = "";
            sendBtn.disabled = true;
            sendBtn.textContent = "思考中...";

            try {
                // 1. 调用硅基流动AI获取回答
                const answer = await callSiliconflowAPI(question);
                // 2. 显示AI回答
                addMessage(answer, "assistant");
                // 3. 用你的克隆声音朗读
                await playReechoVoice(answer);
            } catch (error) {
                addMessage(error.message, "assistant");
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "发送";
            }
        }

        // 添加消息到聊天框
        function addMessage(text, role) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `mb-4 ${role === "user" ? "text-right" : "text-left"}`;
            
            const bubbleDiv = document.createElement("div");
            bubbleDiv.className = `inline-block p-3 rounded-lg ${role === "user" ? "bg-green-100" : "bg-blue-100"}`;
            bubbleDiv.textContent = text;
            
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            // 自动滚动到最新消息
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 绑定事件
        sendBtn.addEventListener("click", sendQuestion);
        questionInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendQuestion();
        });
    </script>
</body>
</html>
