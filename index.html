<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI问答 + 睿声实时语音（全日志版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">AI问答 + 我的专属克隆声音（全日志）</h1>
        
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8 text-center">
            <img src="https://picsum.photos/200/200" alt="数字人" class="mx-auto rounded-lg max-h-96 mb-4">
            <p class="text-gray-600">硅基流动AI + 睿声同步实时语音（控制台查看详细日志）</p>
        </div>
        
        <div id="chat-container" class="bg-white rounded-lg shadow-lg p-6 mb-8 h-96 overflow-y-auto">
            <div class="mb-4">
                <div class="bg-blue-100 rounded-lg p-3 inline-block">
                    你好！按F12打开Console查看语音调用全日志～
                </div>
            </div>
        </div>
        
        <div class="flex gap-4">
            <input type="text" id="question-input" placeholder="请输入你的问题..." 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                发送（查看控制台日志）
            </button>
        </div>
    </div>

    <script>
        // ===================== 核心配置（按睿声实时语音文档） ======================
        const CONFIG = {
            // 睿声同步实时语音配置（文档指定）
            reecho: {
                baseUrl: "https://dev.wusound.cn",       // 文档根域名
                realtimeTtsApi: "/v1/tts/synthesize",    // 同步实时语音核心接口
                apiKey: "sk-12ebe65a69fbdde4e0387a2133661b2e", // 你的睿声API Key
                voiceId: "ef16fe1a-abfe-4e5f-9a9a-d6ac07cea2e2", // 你的克隆声音ID
                timeout: 10000 // 文档建议超时时间：10秒
            },
            // 硅基流动配置
            siliconflow: {
                url: "https://api.siliconflow.cn/v1/chat/completions",
                key: "sk-vsjboqquowgbxbrkqoizrrptqwpizopzfhxtqijfdtkjogft",
                model: "Qwen/Qwen3-8B"
            }
        };

        // 全局变量
        const chatContainer = document.getElementById('chat-container');
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        let activeAudio = null;
        let chatHistory = [{ role: "system", content: "回答简洁，纯中文，无特殊符号，不超过80字。" }];

        // -------------------------- 工具函数：控制台彩色日志（方便区分） --------------------------
        /**
         * 自定义控制台日志（带颜色和分类）
         * @param {string} type 日志类型：info/warn/error/success
         * @param {string} module 模块名：AI/VOICE/MAIN
         * @param {string} message 日志内容
         * @param {any} data 附加数据（可选）
         */
        function log(type, module, message, data = null) {
            const colors = {
                info: "#2196F3",      // 蓝色（普通信息）
                success: "#4CAF50",   // 绿色（成功）
                warn: "#FF9800",      // 橙色（警告）
                error: "#F44336"      // 红色（错误）
            };
            const timestamp = new Date().toLocaleTimeString();
            console.log(
                `%c[${timestamp}] [${module}] ${message}`,
                `color: ${colors[type]}; font-weight: bold;`,
                data ? "\n附加数据：" : "",
                data || ""
            );
        }

        // -------------------------- 1. 硅基流动AI问答（带日志） --------------------------
        async function getAiAnswer(question) {
            log("info", "AI", "开始调用硅基流动AI", { question });
            chatHistory.push({ role: "user", content: question });
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), CONFIG.siliconflow.timeout || 10000);

                // 打印AI请求参数
                const aiRequestData = {
                    model: CONFIG.siliconflow.model,
                    messages: chatHistory,
                    temperature: 0.7,
                    max_tokens: 80,
                    stream: false
                };
                log("info", "AI", "AI请求参数", aiRequestData);

                const res = await fetch(CONFIG.siliconflow.url, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${CONFIG.siliconflow.key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(aiRequestData),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                log("info", "AI", `AI接口响应状态码`, res.status);

                if (!res.ok) {
                    const errorText = await res.text();
                    log("error", "AI", `AI接口请求失败`, { status: res.status, response: errorText });
                    throw new Error(`AI接口错误（状态码：${res.status}）`);
                }

                const aiResponse = await res.json();
                log("success", "AI", "AI接口返回完整数据", aiResponse);
                
                const answer = aiResponse.choices[0].message.content.trim();
                chatHistory.push({ role: "assistant", content: answer });
                log("success", "AI", "AI回答提取完成", { answer });
                
                return answer;
            } catch (err) {
                const errorMsg = err.name === "AbortError" ? "AI请求超时" : err.message;
                log("error", "AI", `AI调用失败`, { error: errorMsg, stack: err.stack });
                throw new Error(`AI回答失败：${errorMsg}`);
            }
        }

        // -------------------------- 2. 睿声同步实时语音（全日志+文档规范） --------------------------
        async function playRealtimeVoice(text) {
            // 1. 文本预处理（文档要求）
            const cleanText = text
                .replace(/[^\u4e00-\u9fa5，。！？、]/g, "") // 仅保留中文+基础标点
                .substring(0, 500); // 文档规定：单条文本≤500字符
            
            log("info", "VOICE", "语音合成文本预处理完成", { rawText: text, cleanText });
            
            if (!cleanText) {
                log("warn", "VOICE", "预处理后文本为空，无法合成语音");
                addMessage("❌ 文本为空/含非法字符，无法合成声音", "assistant");
                return false;
            }

            // 2. 停止上一次音频
            if (activeAudio) {
                activeAudio.pause();
                log("info", "VOICE", "停止上一次音频播放");
                activeAudio = null;
            }

            try {
                addMessage("🔊 正在调用睿声同步实时语音（查看Console日志）...", "assistant");
                // 拼接完整接口地址（文档规范）
                const fullApiUrl = CONFIG.reecho.baseUrl + CONFIG.reecho.realtimeTtsApi;
                log("info", "VOICE", "睿声同步实时语音接口地址", { fullApiUrl });

                // 构造请求参数（严格按文档要求）
                const voiceRequestData = {
                    voice_id: CONFIG.reecho.voiceId, // 文档指定参数名
                    text: cleanText,
                    speed: 1.0,   // 文档范围：0.5~2.0
                    pitch: 1.0,   // 文档范围：0.5~2.0
                    volume: 1.0,  // 文档范围：0.1~10.0
                    format: "mp3" // 文档支持：mp3/wav（默认mp3）
                };
                log("info", "VOICE", "睿声请求参数（文档规范）", voiceRequestData);

                // 3. 调用睿声同步实时语音接口
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), CONFIG.reecho.timeout);

                const res = await fetch(fullApiUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${CONFIG.reecho.apiKey}`, // 文档鉴权方式
                        "Content-Type": "application/json",
                        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
                    },
                    body: JSON.stringify(voiceRequestData),
                    mode: "cors",
                    credentials: "omit",
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                log("info", "VOICE", `睿声接口响应状态码`, res.status);

                // 4. 读取原始响应（先转文本，避免解析失败）
                const rawResponse = await res.text();
                log("info", "VOICE", "睿声接口原始响应文本", rawResponse);

                if (!res.ok) {
                    log("error", "VOICE", `睿声接口请求失败`, { status: res.status, rawResponse });
                    throw new Error(`睿声接口错误（状态码：${res.status}）`);
                }

                // 5. 解析响应（按文档规范）
                let voiceResponse;
                try {
                    voiceResponse = JSON.parse(rawResponse);
                    log("info", "VOICE", "睿声响应JSON解析完成", voiceResponse);
                } catch (parseErr) {
                    log("error", "VOICE", "睿声响应JSON解析失败", { parseErr, rawResponse });
                    throw new Error("睿声返回数据格式错误，无法解析为JSON");
                }

                // 6. 按文档校验响应（核心）
                if (voiceResponse.code !== 0) {
                    log("error", "VOICE", "睿声语音合成失败（非0错误码）", {
                        code: voiceResponse.code,
                        message: voiceResponse.message || "无错误信息"
                    });
                    throw new Error(`睿声错误（code=${voiceResponse.code}）：${voiceResponse.message || "未知错误"}`);
                }

                if (!voiceResponse.data?.audio_url) {
                    log("error", "VOICE", "睿声响应缺失音频链接", voiceResponse.data);
                    throw new Error("睿声未返回有效音频链接（data.audio_url缺失）");
                }

                // 7. 播放语音（带播放日志）
                log("success", "VOICE", "睿声语音合成成功，开始播放", {
                    audioUrl: voiceResponse.data.audio_url,
                    duration: voiceResponse.data.duration || "未知"
                });

                activeAudio = new Audio(voiceResponse.data.audio_url);
                activeAudio.crossOrigin = "anonymous";
                
                // 播放事件日志
                activeAudio.onplay = () => log("success", "VOICE", "音频开始播放");
                activeAudio.onpause = () => log("warn", "VOICE", "音频暂停播放");
                activeAudio.onerror = (err) => {
                    log("error", "VOICE", "音频播放失败", { error: err, audioUrl: voiceResponse.data.audio_url });
                    throw new Error("音频链接无法播放（跨域/失效/格式错误）");
                };
                activeAudio.onended = () => log("info", "VOICE", "音频播放完成");

                await activeAudio.play();
                addMessage("✅ 睿声同步实时语音播放成功！（查看Console看详情）", "assistant");
                return true;

            } catch (err) {
                const errorMsg = err.name === "AbortError" ? "睿声请求超时" : err.message;
                log("error", "VOICE", "睿声同步实时语音调用全流程失败", {
                    error: errorMsg,
                    stack: err.stack
                });
                
                // 精准提示
                let tip = `❌ 语音调用失败：${errorMsg}`;
                if (errorMsg.includes("404")) tip += "（检查voice_id/接口地址）";
                if (errorMsg.includes("401")) tip += "（检查API Key是否过期）";
                if (errorMsg.includes("403")) tip += "（检查额度/声音权限）";
                addMessage(tip, "assistant");
                return false;
            }
        }

        // -------------------------- 3. 主流程（带日志） --------------------------
        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) {
                alert("请输入你的问题！");
                return;
            }

            // 状态更新
            questionInput.value = "";
            sendBtn.disabled = true;
            sendBtn.textContent = "处理中...";
            addMessage(question, "user");
            
            log("info", "MAIN", "开始处理用户请求", { question });

            try {
                // 第一步：获取AI回答
                const aiAnswer = await getAiAnswer(question);
                addMessage(`AI回答：${aiAnswer}`, "assistant");
                log("info", "MAIN", "AI回答获取完成，开始调用语音合成", { aiAnswer });
                
                // 第二步：调用睿声同步实时语音
                await playRealtimeVoice(aiAnswer);
            } catch (err) {
                log("error", "MAIN", "主流程执行失败", { error: err.message });
                addMessage(err.message, "assistant");
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "发送（查看控制台日志）";
                log("info", "MAIN", "用户请求处理完成，恢复按钮状态");
            }
        }

        // -------------------------- 辅助函数：添加聊天消息 --------------------------
        function addMessage(text, role) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `mb-4 ${role === "user" ? "text-right" : "text-left"}`;
            
            const bubble = document.createElement("div");
            bubble.className = `inline-block p-3 rounded-lg ${role === "user" ? "bg-green-100" : "bg-blue-100"}`;
            bubble.textContent = text;
            
            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // -------------------------- 初始化日志 + 事件绑定 --------------------------
        log("success", "INIT", "页面初始化完成，配置加载成功", CONFIG);
        sendBtn.addEventListener("click", sendQuestion);
        questionInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                log("info", "MAIN", "用户按Enter键触发发送");
                sendQuestion();
            }
        });
    </script>
</body>
</html>
