<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老师数字助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">老师数字助手</h1>
        
        <!-- 数字人展示区（头像已自动替换） -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8 text-center">
            <img id="avatar" src="https://ts1.tc.mm.bing.net/th/id/OIP-C.MboIhEoeG3nd8LNGy7pPWgHaHf?rs=1&pid=ImgDetMain&o=7&rm=3" alt="老师" class="mx-auto rounded-lg max-h-96 mb-4">
            <p class="text-gray-600">有任何问题都可以问我哦！</p>
        </div>
        
        <!-- 问答区 -->
        <div id="chat-container" class="bg-white rounded-lg shadow-lg p-6 mb-8 h-96 overflow-y-auto">
            <div class="mb-4">
                <div class="bg-blue-100 rounded-lg p-3 inline-block">
                    同学你好！我是老师的数字助手，你可以问我关于课程、作业、知识点的任何问题。
                </div>
            </div>
        </div>
        
        <!-- 输入区 -->
        <div class="flex gap-4">
            <input type="text" id="question-input" placeholder="请输入你的问题..." 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                发送
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');

        // ===================== 所有配置已全部完成，无需修改 =====================
        const DOUBAO_API_KEY = 'ark-dc0f429f-7353-4b11-a8f8-4f191aceade1-53f45';
        const DOUBAO_MODEL_ID = 'doubao-1.5-lite-32k-250115';
        const BAIDU_API_KEY = 'O4tJskSjBxr4VuG9NaE0vYMF';
        const BAIDU_SECRET_KEY = '5komCONmCP42oZRCWPC9rXHcNmbJMANC';
        const YOUR_VOICE_ID = 20007263; // 你在百度曦灵定制的声音ID

        // 发送问题
        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            // 显示用户问题
            addMessage(question, 'user');
            questionInput.value = '';

            try {
                // 1. 调用豆包大模型生成老师风格的回答
                const answer = await getDoubaoAnswer(question);
                
                // 2. 显示回答文字
                addMessage(answer, 'assistant');
                
                // 3. 用你定制的声音播放回答
                await playBaiduVoice(answer);
                
            } catch (error) {
                addMessage('抱歉，我现在有点忙，请稍后再试。', 'assistant');
                console.error('错误详情:', error);
            }
        }

        // 调用豆包大模型
        async function getDoubaoAnswer(question) {
            const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${DOUBAO_API_KEY}`
                },
                body: JSON.stringify({
                    model: DOUBAO_MODEL_ID,
                    messages: [
                        {
                            role: 'system',
                            content: '你是一位耐心负责的中小学老师，用通俗易懂的语言回答学生的问题，语气亲切温和，像老师和学生说话一样。不要使用过于专业的术语，复杂的问题分点讲解，经常鼓励学生。'
                        },
                        {
                            role: 'user',
                            content: question
                        }
                    ],
                    temperature: 0.7,
                    max_tokens: 1000
                })
            });

            if (!response.ok) {
                throw new Error(`API请求失败: ${response.status}`);
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        // 百度智能云语音合成（使用你定制的声音）
        async function playBaiduVoice(text) {
            try {
                // 1. 获取access_token（有效期30天）
                const tokenResponse = await fetch(`https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${BAIDU_API_KEY}&client_secret=${BAIDU_SECRET_KEY}`);
                const tokenData = await tokenResponse.json();
                
                if (!tokenData.access_token) {
                    throw new Error('获取百度token失败');
                }

                // 2. 调用语音合成API
                const ttsResponse = await fetch(`https://tsn.baidu.com/text2audio`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({
                        'tex': encodeURIComponent(text),
                        'tok': tokenData.access_token,
                        'cuid': 'teacher_digital_assistant',
                        'ctp': '1',
                        'lan': 'zh',
                        'per': YOUR_VOICE_ID, // 使用你定制的声音
                        'spd': '4', // 语速：0-9，4比较适合老师讲课
                        'pit': '5', // 音调：0-9，5是正常
                        'vol': '6', // 音量：0-9，6比较合适
                        'aue': '3' // 输出格式为mp3
                    })
                });

                // 3. 播放生成的语音
                const audioBlob = await ttsResponse.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                
                const audioPlayer = new Audio(audioUrl);
                await audioPlayer.play();

            } catch (error) {
                console.error('语音合成失败，降级使用浏览器内置TTS:', error);
                // 失败时自动降级使用浏览器内置TTS
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.95;
                speechSynthesis.speak(utterance);
            }
        }

        // 添加消息到聊天框
        function addMessage(text, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `mb-4 ${role === 'user' ? 'text-right' : 'text-left'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `inline-block p-3 rounded-lg ${role === 'user' ? 'bg-green-100' : 'bg-blue-100'}`;
            bubbleDiv.textContent = text;
            
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 事件监听
        sendBtn.addEventListener('click', sendQuestion);
        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendQuestion();
        });
    </script>
</body>
</html>
