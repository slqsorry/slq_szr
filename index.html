<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的数字人助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">我的数字人助手</h1>
        
        <!-- 数字人展示区 -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8 text-center">
            <img id="avatar" src="https://ts1.tc.mm.bing.net/th/id/OIP-C.MboIhEoeGnd8LNGy7pPWgHaHf?rs=1&pid=ImgDetMain&o=7&rm=3" alt="数字人" class="mx-auto rounded-lg max-h-96 mb-4">
            <p class="text-gray-600">你可以向我提问，我会用我的声音为你解答！</p>
        </div>
        
        <!-- 聊天区域 -->
        <div id="chat-container" class="bg-white rounded-lg shadow-lg p-6 mb-8 h-96 overflow-y-auto">
            <div class="mb-4">
                <div class="bg-blue-100 rounded-lg p-3 inline-block">
                    你好！我是你的专属数字人助手，有任何问题都可以问我～
                </div>
            </div>
        </div>
        
        <!-- 输入区 -->
        <div class="flex gap-4">
            <input type="text" id="question-input" placeholder="请输入你的问题..." 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                发送
            </button>
        </div>
    </div>

    <script>
        // ===================== 配置项（确认以下信息正确即可） ======================
        // 1. 睿声TTS配置（按官方文档规范）
        const REECHO_CONFIG = {
            apiKey: "sk-12ebe65a69fbdde4e0387a2133661b2e",       // 你的睿声API Key
            voiceId: "ef16fe1a-abfe-4e5f-9a9a-d6ac07cea2e2",    // 你的克隆声音ID
            apiUrl: "https://v1.wusound.cn/api/tts/simple-generate", // 官方标准地址
            maxTextLen: 500,                                     // 文档规定的最大文本长度
            qpsLimit: 1000                                       // 文档规定的QPS（1秒/次）
        };
        
        // 2. 硅基流动AI配置（正确密钥）
        const SILICONFLOW_CONFIG = {
            url: "https://api.siliconflow.cn/v1/chat/completions",
            key: "sk-vsjboqquowgbxbrkqoizrrptqwpizopzfhxtqijfdtkjogft",
            model: "Qwen/Qwen3-8B"
        };
        // ===============================================================

        // 全局变量
        const chatContainer = document.getElementById('chat-container');
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        let currentAudio = null;
        let chatHistory = [{ role: "system", content: "你是友好的智能助手，回答简洁易懂，只用中文，不超过100字。" }];
        let lastReechoCallTime = 0; // 睿声调用时间戳（防QPS超限）

        // -------------------------- 硅基流动AI问答（稳定调用） --------------------------
        async function callSiliconflowAPI(question) {
            chatHistory.push({ role: "user", content: question });
            
            try {
                const response = await fetch(SILICONFLOW_CONFIG.url, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${SILICONFLOW_CONFIG.key}`,
                        "Content-Type": "application/json",
                        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                    },
                    body: JSON.stringify({
                        model: SILICONFLOW_CONFIG.model,
                        messages: chatHistory,
                        temperature: 0.7,
                        max_tokens: 100, // 限制回答长度，适配睿声文本限制
                        stream: false
                    }),
                    credentials: "omit"
                });

                // 精准错误提示
                if (response.status === 401) throw new Error("🔑 硅基流动密钥无效！请核对密钥");
                if (response.status === 403) throw new Error("🚫 硅基流动账号无额度/权限！");
                if (!response.ok) throw new Error(`AI接口错误：${response.status} - ${await response.text()}`);

                const data = await response.json();
                const answer = data.choices[0].message.content.trim();
                chatHistory.push({ role: "assistant", content: answer });
                return answer;
            } catch (error) {
                console.error("硅基流动API错误：", error);
                throw new Error(error.message);
            }
        }

        // -------------------------- 睿声TTS（严格遵循官方文档） --------------------------
        // 文本预处理：截断+过滤特殊字符（解决文档规定的文本限制）
        function preprocessText(text) {
            // 1. 截断超长文本（文档规定≤500字符）
            if (text.length > REECHO_CONFIG.maxTextLen) {
                text = text.substring(0, REECHO_CONFIG.maxTextLen) + "（文本过长，已截断）";
            }
            // 2. 过滤特殊字符/emoji（避免接口返回异常）
            text = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9，。！？、：；""''()（）]/g, "");
            return text;
        }

        // 睿声TTS核心调用（按官方文档规范）
        async function playReechoVoice(text) {
            // 停止上一次音频
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            // 1. 文本预处理
            const processedText = preprocessText(text);
            // 2. QPS限流（文档规定1秒/次）
            const now = Date.now();
            if (now - lastReechoCallTime < REECHO_CONFIG.qpsLimit) {
                await new Promise(resolve => setTimeout(resolve, REECHO_CONFIG.qpsLimit - (now - lastReechoCallTime)));
            }
            lastReechoCallTime = Date.now();

            try {
                // 3. 按官方文档调用接口（无跨域代理）
                const response = await fetch(REECHO_CONFIG.apiUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${REECHO_CONFIG.apiKey}`, // 文档规定的鉴权方式
                        "Content-Type": "application/json",                // 文档要求的请求头
                        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                    },
                    body: JSON.stringify({
                        voiceId: REECHO_CONFIG.voiceId, // 文档必填项
                        text: processedText,            // 预处理后的文本
                        speed: 1.0,                     // 文档规定范围：0.5~2.0
                        pitch: 1.0,                     // 文档规定范围：0.5~2.0
                        volume: 1.0                     // 文档规定范围：0.1~10.0
                    }),
                    credentials: "omit",
                    mode: "cors" // 文档支持CORS，无需代理
                });

                // 4. 按官方文档校验响应（先查状态码，再解析JSON）
                if (!response.ok) {
                    throw new Error(`睿声接口HTTP错误：${response.status} - ${await response.text()}`);
                }

                // 5. 解析响应（容错处理）
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    throw new Error("睿声返回数据格式错误：无法解析JSON");
                }

                // 6. 按官方文档校验code和success（核心解决Error: OK）
                if (data.code !== 0 || data.success !== true) {
                    throw new Error(`睿声合成失败：${data.message || "未知错误"}（错误码：${data.code || "无"}）`);
                }

                // 7. 校验音频链接（文档规定的返回字段）
                if (!data.data || !data.data.audioUrl) {
                    throw new Error("睿声返回无有效音频链接");
                }

                // 8. 播放音频（处理跨域）
                currentAudio = new Audio(data.data.audioUrl);
                currentAudio.crossOrigin = "anonymous";
                currentAudio.onerror = () => { throw new Error("音频链接无效，无法播放"); };
                await currentAudio.play();

            } catch (error) {
                console.error("睿声API错误：", error);
                // 降级方案：浏览器自带语音（确保有声音输出）
                const utterance = new SpeechSynthesisUtterance(processedText);
                utterance.lang = "zh-CN";
                utterance.rate = 1.0;
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // -------------------------- 主流程：发送问题 --------------------------
        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) {
                alert("请输入你的问题！");
                return;
            }

            // 显示用户问题
            addMessage(question, "user");
            questionInput.value = "";
            sendBtn.disabled = true;
            sendBtn.textContent = "思考中...";

            try {
                // 1. 调用硅基流动AI获取回答
                const answer = await callSiliconflowAPI(question);
                // 2. 显示AI回答
                addMessage(answer, "assistant");
                // 3. 调用睿声TTS播放克隆声音
                await playReechoVoice(answer);
            } catch (error) {
                addMessage(error.message, "assistant");
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "发送";
            }
        }

        // -------------------------- 辅助函数：添加聊天消息 --------------------------
        function addMessage(text, role) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `mb-4 ${role === "user" ? "text-right" : "text-left"}`;
            
            const bubbleDiv = document.createElement("div");
            bubbleDiv.className = `inline-block p-3 rounded-lg ${role === "user" ? "bg-green-100" : "bg-blue-100"}`;
            bubbleDiv.textContent = text;
            
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            // 自动滚动到最新消息
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // -------------------------- 事件绑定 --------------------------
        sendBtn.addEventListener("click", sendQuestion);
        questionInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendQuestion();
        });
    </script>
</body>
</html>
